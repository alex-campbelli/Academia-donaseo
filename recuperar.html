<script>
  // Esta página ya no cambia contraseñas: eso vive en el Portal.

  // que va después de "#", que es donde Supabase pone el token del enlace.
  // Va aquí arriba y con replace() para que salte de una y no quede en el
  // historial (así el botón "atrás" no devuelve a esta página).
  // No usa ninguna llave ni habla con la base: solo reenvía.
  location.replace('https://panel.donaseoltda.com/' + location.search + location.hash);
</script>
